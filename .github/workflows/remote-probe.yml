name: Relay remote probe

# Manually run: starts the relay (watchparty-relay/) and checks that its
# remote page's searches reach JustWatch through the relay
# (tools/probe/remote_fetch.py).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          python3 watchparty-relay/relay_standalone.py --port 8799 &
          sleep 2
          python3 tools/probe/remote_fetch.py http://127.0.0.1:8799
