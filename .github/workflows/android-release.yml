name: Android release

# Builds the Android app the official way (Android Gradle plugin): unit
# tests, then the release App Bundle (.aab, what Google Play takes) and a
# release APK (for sideloading). Runs on every change to watchparty-tv/ to
# check the build, and by hand (Actions → Android release → Run workflow).
#
# Signed with your upload key when these repository secrets are set
# (Settings → Secrets and variables → Actions); unsigned otherwise:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64 (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias (e.g. upload)
#   ANDROID_KEY_PASSWORD       the key's password
# Raise versionCode in watchparty-tv/app/build.gradle.kts for each upload.
on:
  push:
    branches: [ main ]
    paths:
      - 'watchparty-tv/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: watchparty-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "WATCHPARTY_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: the bundle and APK are unsigned (fine for checking the build; Play needs them signed)"
          fi
      - name: Bundle and APK
        env:
          WATCHPARTY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WATCHPARTY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WATCHPARTY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: watchparty-android
          path: |
            watchparty-tv/app/build/outputs/bundle/release/*.aab
            watchparty-tv/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
