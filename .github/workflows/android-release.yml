name: Android release

# Builds the Android app the official way (Android Gradle plugin): unit
# tests, then the release App Bundle (.aab, what Google Play takes) and a
# release APK (for sideloading). Runs on every change to watchparty-tv/ to
# check the build, and by hand (Actions → Android release → Run workflow).
#
# Signed with your upload key when these repository secrets are set
# (Settings → Secrets and variables → Actions); unsigned otherwise:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64 (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias (e.g. upload)
#   ANDROID_KEY_PASSWORD       the key's password
# (or the same with SIGNING_ in place of ANDROID_: SIGNING_KEYSTORE_BASE64, …;
# the keystore password also as SIGNING_STORE_PASSWORD, and when none is set
# the key's password is used: keytool's PKCS12 keystores have just one)
# Raise versionCode in watchparty-tv/app/build.gradle.kts for each upload.
on:
  push:
    branches: [ main ]
    paths:
      - 'watchparty-tv/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: watchparty-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # which are set (never their values), to see a misnamed one
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: not set"; fi
          done
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "WATCHPARTY_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 (or SIGNING_KEYSTORE_BASE64) secret: the bundle and APK are unsigned (fine for checking the build; Play needs them signed)"
          fi
      - name: Bundle and APK
        env:
          WATCHPARTY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          WATCHPARTY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          WATCHPARTY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/bin/apksigner "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$apksigner" verify --verbose --print-certs "$apk" 2>&1 | grep -E 'Verifies|Verified using|Signer #1 certificate (DN|SHA-256)|ERROR|DOES NOT' || echo "(no signature information)"
          done
          for aab in app/build/outputs/bundle/release/*.aab; do
            echo "== $aab"
            keytool -printcert -jarfile "$aab" | grep -E 'Owner:|SHA256:' || echo "not signed"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: watchparty-android
          path: |
            watchparty-tv/app/build/outputs/bundle/release/*.aab
            watchparty-tv/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
