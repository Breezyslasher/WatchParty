name: Publish relay image

# The relay's Docker image, ghcr.io/<owner>/watchparty-relay (amd64, arm64,
# armv7 — a Raspberry Pi works), tagged latest and with the commit.
on:
  push:
    branches: [ main ]
    paths:
      - 'watchparty-relay/Dockerfile'
      - 'watchparty-relay/relay.py'
      - 'watchparty-relay/relay_standalone.py'
      - 'watchparty-relay/remote/**'
      - 'watchparty-browser/extension/links.js'
      - 'watchparty-browser/extension/justwatch.js'
      - 'watchparty-browser/extension/hbomax.js'
      - 'watchparty-browser/extension/relay.js'
      - 'watchparty-browser/extension/ui.js'
      - 'watchparty-browser/extension/screens.js'
      - 'watchparty-browser/extension/room.css'
      - '.github/workflows/publish-relay.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: watchparty-relay

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Relay tests
        run: python3 -m unittest discover watchparty-relay/tests
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          echo "tags=${BASE}:latest,${BASE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: watchparty-relay/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Watch Party relay
            org.opencontainers.image.description=The Watch Party relay: rooms for Kodi, Android, browsers and the remote page
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
